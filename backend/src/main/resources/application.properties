server.address=127.0.0.1
server.port=${PORT:8081}
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB
server.error.include-message=never
spring.jackson.default-property-inclusion=non_null
app.origin=${APP_ORIGIN:http://127.0.0.1:5174}
app.bootstrap-email=${BOOTSTRAP_EMAIL:admin@local.test}
app.bootstrap-password=${BOOTSTRAP_PASSWORD}
app.extractor=${EXTRACTOR_PATH}
app.ai-url=${AI_BASE_URL:http://127.0.0.1:20128/v1}
app.ai-key=${AI_API_KEY:}
app.ai-model=${AI_MODEL:ag/gemini-3.8-flash-low}
logging.level.org.springframework.web=ERROR
